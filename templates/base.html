<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cine Booking{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="logo" href="{{ url_for('home') }}"><span>CB</span> Cine Booking</a>
  <nav class="main-nav"><a href="{{ url_for('home') }}#movies">Movies</a><a href="{{ url_for('home') }}#upcoming">Stream</a><a href="{{ url_for('home') }}#theatres">Events</a><a href="{{ url_for('home') }}#languages">Languages</a></nav>
    <div class="top-actions"><span class="location-pill">⌖ Bengaluru⌄</span><a class="view-booking-link" href="{{ url_for('booking_lookup') }}">View booking</a><a class="admin-login-link" href="{{ url_for('admin_login') }}">Admin login</a><button class="menu-button" type="button" aria-label="Open menu">☰</button></div>
</header>
{% block content %}{% endblock %}
<footer><strong>Cine Booking</strong><span>Book your seat. Enjoy the show.</span></footer>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
